# CI: runs on GitHub's servers on every push to master and every pull request.
# Job 1 checks the code (lint, unit tests, chart, image build). Job 2 deploys the whole system
# to a real kind cluster using the repo's own scripts and tests it like a user would.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read # least privilege: CI only needs to read the code

concurrency: # a newer push to the same branch cancels the older, now-pointless run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, unit tests, chart, image build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13" # same as the Dockerfile's base image
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r api/requirements-dev.txt

      - name: Lint (ruff)
        working-directory: api
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (pytest)
        working-directory: api
        run: pytest -v

      - uses: azure/setup-helm@v5
        with:
          version: v4.2.2

      - name: Lint Helm chart
        run: |
          helm lint helm/url-short
          helm template url-short helm/url-short > /dev/null

      - name: Build Docker image
        run: docker build -t url-short-api:ci ./api

  compose:
    name: Docker Compose on a clean checkout
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Exactly the brief's command, with no .env file (a fresh checkout has none).
      - name: docker compose up --build (no .env)
        run: |
          test ! -f .env
          docker compose up --build -d
          for i in $(seq 1 45); do curl -sf -o /dev/null http://localhost:8000/health && break; sleep 2; done

      - name: Smoke test
        run: bash scripts/smoke-test.sh

      - name: Redis outage - links still work (served from Postgres)
        run: |
          docker compose stop redis
          RESULT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:8000/1)
          echo "Redirect with Redis down: $RESULT"
          test "$RESULT" = "302 https://example.com/smoke-test"

      - name: Debug info (only if something failed)
        if: failure()
        run: docker compose ps; docker compose logs --tail=100

  e2e:
    name: End-to-end on kind (Helm ${{ matrix.helm }})
    needs: checks # don't spend ~5 min on a cluster if the basic checks already failed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # if one Helm version fails, still finish the other - shows which one broke
      matrix:
        helm: [v3.22.0, v4.2.2] # testers may have either; setup-k8s.sh handles both
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm }}

      - name: Install kind + kubectl (the cluster itself is created by setup-k8s.sh)
        uses: helm/kind-action@v1.15.0
        with:
          version: v0.33.0
          install_only: true

      - name: Deploy with scripts/setup-k8s.sh
        run: bash scripts/setup-k8s.sh

      - name: Smoke test (shorten, redirect, errors, health)
        run: bash scripts/smoke-test.sh

      - name: Drift check (cluster matches git)
        run: bash scripts/check-drift.sh

      # Redis is only a cache: without it the API must keep serving from Postgres and stay in
      # the readiness pool (before the fix, readiness removed it after ~15s = full outage).
      - name: Redis outage - API stays ready and links still work
        run: |
          kubectl scale deploy/redis --replicas=0
          kubectl wait --for=delete pod -l app=redis --timeout=60s
          sleep 20   # longer than readiness needs to fail (3 x 5s)
          kubectl get pods -l app=api
          test "$(kubectl get pods -l app=api -o jsonpath='{.items[0].status.containerStatuses[0].ready}')" = "true"
          RESULT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://localhost:8000/1)
          echo "Redirect with Redis down: $RESULT"
          test "$RESULT" = "302 https://example.com/smoke-test"
          kubectl scale deploy/redis --replicas=1
          kubectl rollout status deploy/redis --timeout=90s

      # Postgres down: the API can't work, so it must say so fast and clearly - 503 (not a 500
      # "bug"), /health answering in seconds (before the fix it could hang for up to 60s).
      - name: Postgres outage - fast 503s, recovers afterwards
        run: |
          kubectl scale deploy/postgres --replicas=0
          kubectl wait --for=delete pod -l app=postgres --timeout=60s
          HEALTH=$(curl -s -m 10 -o /dev/null -w '%{http_code} %{time_total}' http://localhost:8000/health)
          SHORTEN=$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://localhost:8000/shorten \
                      -H "Content-Type: application/json" -d '{"url":"https://example.com/pg-down"}')
          echo "/health: $HEALTH   shorten: $SHORTEN"
          test "${HEALTH%% *}" = "503"
          awk -v t="${HEALTH##* }" 'BEGIN { exit !(t < 5) }'   # answered in under 5s
          test "$SHORTEN" = "503"
          kubectl scale deploy/postgres --replicas=1
          kubectl rollout status deploy/postgres --timeout=120s
          for i in $(seq 1 40); do curl -sf -o /dev/null http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health

      - name: Data survives stop-k8s + setup-k8s
        run: |
          CODE=$(curl -s http://localhost:8000/shorten -H "Content-Type: application/json" \
                   -d '{"url":"https://example.com/persist"}' | sed -n 's/.*"short_code":"\([^"]*\)".*/\1/p')
          echo "Created short code: $CODE"
          bash scripts/stop-k8s.sh
          bash scripts/setup-k8s.sh
          RESULT=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://localhost:8000/$CODE")
          echo "After restart: $RESULT"
          test "$RESULT" = "302 https://example.com/persist"
          # /health's links_stored comes from Postgres, so it must not reset like the counters do
          curl -s http://localhost:8000/health | grep -q '"links_stored":[1-9]'
          # a slow start after the restart must not be mistaken for a hang (startupProbe)
          KILLS=$(kubectl get events | grep -c "failed liveness probe" || true)
          echo "Liveness-probe kills: $KILLS"
          test "$KILLS" -eq 0

      - name: Debug info (only if something failed)
        if: failure()
        run: |
          kubectl get pods,svc,pvc -o wide || true
          kubectl describe pods || true
          kubectl logs -l app=api --tail=100 || true
          kubectl logs -l app=postgres --tail=50 || true
