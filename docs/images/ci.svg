<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="CI on every push: first the checks job runs lint, unit tests, the Helm chart check and the Docker build. Only if it passes, two test jobs run: a Docker Compose test and a Kubernetes test on Helm 3 and Helm 4, each starting the app, using it and breaking it on purpose. The result is a pass or fail mark on the commit.">
  <style>
    .bg { fill: #FFFFFF; stroke: #D0D7DE; }
    .box { fill: #F6F8FA; stroke: #1F2328; stroke-width: 1.2; }
    .res { fill: #FFF4ED; stroke: #C2410C; stroke-width: 1.6; }
    .t { font: 600 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1F2328; }
    .s { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #59636E; }
    .acc { font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #C2410C; }
    .ln { stroke: #1F2328; stroke-width: 1.4; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#1F2328"/></marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="759" height="209" rx="8"/>

  <rect class="box" x="16" y="80" width="100" height="50" rx="6"/>
  <text class="t" x="66" y="101" text-anchor="middle">git push</text>
  <text class="s" x="66" y="118" text-anchor="middle">or pull request</text>
  <line class="ln" x1="116" y1="105" x2="160" y2="105" marker-end="url(#a)"/>

  <rect class="box" x="160" y="60" width="180" height="90" rx="6"/>
  <text class="t" x="176" y="84">1 · Checks</text>
  <text class="s" x="176" y="106">lint + unit tests</text>
  <text class="s" x="176" y="124">Helm chart + Docker build</text>

  <line class="ln" x1="340" y1="90" x2="400" y2="52" marker-end="url(#a)"/>
  <line class="ln" x1="340" y1="120" x2="400" y2="156" marker-end="url(#a)"/>
  <text class="acc" x="346" y="110">if they pass</text>

  <rect class="box" x="400" y="16" width="200" height="72" rx="6"/>
  <text class="t" x="416" y="40">2 · Docker Compose test</text>
  <text class="s" x="416" y="60">start it, use it,</text>
  <text class="s" x="416" y="76">stop Redis on purpose</text>

  <rect class="box" x="400" y="118" width="200" height="76" rx="6"/>
  <text class="t" x="416" y="142">2 · Kubernetes test</text>
  <text class="s" x="416" y="162">Helm 3 and Helm 4</text>
  <text class="s" x="416" y="178">deploy, use it, break things</text>

  <line class="ln" x1="600" y1="52" x2="640" y2="92" marker-end="url(#a)"/>
  <line class="ln" x1="600" y1="156" x2="640" y2="118" marker-end="url(#a)"/>
  <rect class="res" x="640" y="80" width="106" height="50" rx="6"/>
  <text class="t" x="693" y="101" text-anchor="middle">✓ or ✗</text>
  <text class="s" x="693" y="118" text-anchor="middle">on the commit</text>
</svg>
