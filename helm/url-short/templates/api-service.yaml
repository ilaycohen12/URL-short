apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "url-short.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: {{ .Values.api.servicePort }}
      targetPort: {{ .Values.api.servicePort }}
      nodePort: {{ .Values.api.nodePort }}
